name: native-source-authority-verification

# Historical full-system consolidation no longer runs on branch pushes.
# Restoring the old local mirror is explicit via:
# tools/full_system_consolidate.sh --restore-full-mirror
# This workflow is optional; normal verification runs locally without runners.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-native-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify pinned Take-5 authority in its source repository
        run: python tools/check_full_system_authority.py
