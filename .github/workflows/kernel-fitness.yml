name: kernel-fitness
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python tools/check_kernel.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python tools/repository_search.py build
      - run: python tools/repository_search.py check
      - name: Refresh derived repository search index
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- search_index; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add search_index
            git commit -m "Refresh derived repository search index [skip ci]"
            git push
          fi
