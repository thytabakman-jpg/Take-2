name: kernel-fitness
on:
  push:
  pull_request:
jobs:
  fitness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_kernel.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
