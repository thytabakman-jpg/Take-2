purpose: >
  Apply the directed 6x6 scope-transition architecture to the complete discovery and
  novelty inventory, determine which discoveries legitimately promote into paper-level
  contribution claims, identify irreducible contribution bundles, and isolate the
  strongest bounded novelty intersection.

