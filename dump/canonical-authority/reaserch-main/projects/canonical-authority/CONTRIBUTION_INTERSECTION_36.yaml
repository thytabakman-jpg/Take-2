strongest_novelty_intersection:
  id: N_star
  statement: >
    The strongest defensible novelty is the intersection of: a fixed truth target for
    heterogeneous canonical mechanisms; preservation of native source function and
    source/bridge attribution; package-aware TRACE; rival DISCRIMINATE; evaluator
    RECOGNIZE; a separate conditional COMPOSE/defeat layer; and a worked source-grounded
    case showing a bounded package-TRACE obstruction from which target-relative,
    attribution-sensitive authority is derived.
  compact_formula: >
    N* = I1 ∩ I2 ∩ I3 ∩ I4 ∩ I5
  novelty_status: bounded_to_reviewed_comparator_corpus
  prohibited_inflations:
    - do_not_claim_each_component_is_individually_novel
    - do_not_claim_universal_negative_about_Jewish_adjudication
    - do_not_claim_case_representativeness
    - do_not_claim_COMPOSE_is_realized_in_current_case
    - do_not_claim_authority_is_epistemically_irrelevant
  nearest_neighbor_basis:
    - CANON:D:019
    - CANON:D:043
    - CANON:D:048

