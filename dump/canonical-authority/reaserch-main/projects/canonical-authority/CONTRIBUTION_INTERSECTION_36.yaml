  discovery_count: 139
  all_discoveries_dispositioned: true
  role_counts:
    core_argument: 40
    support: 15
    source_control: 4
    research_control_only: 74
    excluded: 1
    future_paper: 2
    future_support_evidence: 1
    corpus_expansion_control: 1
    future_project: 1

promotion_rule: >
  A discovery promotes from local/source/control scope to paper-level contribution only
  when upward transition preserves source grounding, claim calibration, result sensitivity,
  manuscript necessity, novelty relevance, and boundedness. Local usefulness is not enough.

scope_transition_tests:
  SYS_to_COMP: >
    Whole-paper contribution architecture constrains what local claims need visible support.
  COMP_to_SYS: >
    Local discovery promotes only with a complete contribution path; this is the main
    anti-inflation gate.
  INT_to_SYS: >
    Interface/bridge findings become paper-level only when they change the paper's
    argument or contribution rather than merely repair handoff clarity.
  BND_to_SYS: >
    Boundary discoveries promote only when decomposition changes what the paper claims,
    not merely how backend objects are organized.
  XL_to_SYS: >
    Source/runtime/control findings promote only through a licensed research-to-manuscript
    bridge.
  SYS_to_XL: >
    Paper claims must remain realizable in source evidence, manuscript prose, and
    publication context.

paper_level_irreducible_bundles:

  - id: I1
    name: fixed_target_heterogeneous_comparison
    statement: >
      A fixed rival proposition-pair can serve as a tertium comparationis for heterogeneous
      Jewish authority and knowledge mechanisms while preserving their native domains,
      functions, and output types.
    load_bearing_discoveries:
      - CANON:D:001
      - CANON:D:002
      - CANON:D:003
      - CANON:D:004
      - CANON:D:025
      - CANON:D:026
    support_discoveries:
      - CANON:D:009
      - CANON:D:010
      - CANON:D:015
      - CANON:D:024
      - CANON:D:028
    earning_location:
      primary: Section 2
      support: Section 3
    independence: irreducible
    why_not_collapse: >
      Without I1, the later method has no principled common target and risks flattening
      functionally different mechanisms.

  - id: I2
    name: source_attributable_route_architecture
    statement: >
      Truth-directed use of an authority mechanism requires source reconstruction plus
      a licensed source-to-target path, rival discrimination, and evaluator-usable
      recognition, while added bridge information remains attributable to the layer
      that supplies it.
    reader_form:
      setup: PROFILE
      route_jobs: [TRACE, DISCRIMINATE, RECOGNIZE]
    load_bearing_discoveries:
      - CANON:D:005
      - CANON:D:006
      - CANON:D:007
      - CANON:D:008
      - CANON:D:032
      - CANON:D:037
      - CANON:D:038
      - CANON:D:054
    support_discoveries:
      - CANON:D:017
      - CANON:D:021
      - CANON:D:023
      - CANON:D:029
      - CANON:D:033
      - CANON:D:034
      - CANON:D:035
      - CANON:D:053
      - CANON:D:074
    earning_location:
      primary: Section 4
      prerequisites: Section 3
    independence: irreducible
    why_not_collapse: >
      TRACE, DISCRIMINATE, and RECOGNIZE survive deletion/collapse tests as different
      jobs; PROFILE is required setup rather than another success gate.

  - id: I3
    name: package_and_composition_separation
    statement: >
      Source packages may jointly establish one target-indexed ground inside TRACE, but
      selection among several completed grounds is a distinct COMPOSE/defeat problem;
      selector information introduced by composition must be attributed to that layer.
    load_bearing_discoveries:
      - CANON:D:039
      - CANON:D:044
      - CANON:D:045
      - CANON:D:052
      - CANON:D:056
      - CANON:D:057
      - CANON:D:073
      - CANON:D:079
      - CANON:D:081
    support_discoveries:
      - CANON:D:055
    earning_location:
      primary: Section 4
      activated_case_role: dormant_in_current_case
    independence: irreducible_conditional_boundary
    why_not_collapse: >
      Package TRACE combines evidence to establish one ground; COMPOSE combines or
      defeats already-established grounds. Collapsing them misattributes selector content.

  - id: I4
    name: bounded_worked_case_result
    statement: >
      In the current purposive seven-family corpus, no independently admissible source
      package completes the proposition-specific TRACE to I_S; the Rashi-Ramban case
      therefore stops at package TRACE while the positive control shows that the method
      permits traditional truth-directed success in principle.
    load_bearing_discoveries:
      - CANON:D:011
      - CANON:D:012
      - CANON:D:042
      - CANON:D:058
      - CANON:D:059
    support_discoveries:
      - CANON:D:013
      - CANON:D:014
      - CANON:D:018
      - CANON:D:047
    earning_location:
      positive_control: Section 5.1
      strongest_case_route: Section 5.2
      result: Section 5.3
    independence: irreducible_empirical_worked_result
    why_not_collapse: >
      The method contribution does not entail the case result; the result depends on
      source/corpus execution. The positive control prevents failure-by-construction.

  - id: I5
    name: target_relative_attribution_sensitive_authority
    statement: >
      Authority is target-relative: native authority or canonical success at one output
      does not automatically transfer to descriptive truth at another target, and any
      outcome-material bridge or selector must be attributed to the layer that supplies it.
    load_bearing_discoveries:
      - CANON:D:006
      - CANON:D:025
      - CANON:D:050
      - CANON:D:052
      - CANON:D:053
    support_discoveries:
      - CANON:D:009
      - CANON:D:016
      - CANON:D:023
      - CANON:D:028
      - CANON:D:030
    earning_location:
      primary: Section 6
    independence: derived_but_irreducible_significance
    derivation: I1 + I2 + attribution_results
    why_not_collapse: >
      It is not required for the bounded case result, but ablation shows it is required
      for the paper's broader philosophical contribution.

