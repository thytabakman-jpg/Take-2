dependency_contracts:
  SPINE.yaml: >
    Stable identity dependency. A substantive spine change is major and cannot be
    silently absorbed as an ordinary ceiling raise.
  research/SOURCE_MODULES.yaml: >
    Detailed module authority. A material module change requires regression of
    current_module_results and refresh of this architecture snapshot.
  research/SOURCE_REGISTRY.yaml: >
    Exact source-identity authority. Source modules refer to stable CANON:SRC IDs;
    source-registry verification changes require review of every affected module but
    do not silently change its inferential result.
  research/CEILING_RAISE_REGISTER.yaml: >
    Candidate/decision history. A central or article-visible move absent from this
    architecture is a promotion gap and is not part of the current paper.
  research/DISCOVERY_MAP.yaml: >
    Discovery history and attachment map. Discovery presence alone does not alter
    this architecture.
  PROVENANCE.yaml: >
    Historical support. New provenance can strengthen or challenge architecture but
    does not silently alter it.
  STATE.yaml: >
    Operational derivative. It points to this object; it does not redefine it.

research_to_manuscript_boundary:
  research_object: RESEARCH_ARCHITECTURE.yaml
  manuscript_status: absent_not_yet_drafted
  manuscript_rule: >
    The eventual manuscript must be derived from this research object and the
    MANUSCRIPT_CONTRACT. Research registers and audit history are not copied into the
    article merely because they exist.

