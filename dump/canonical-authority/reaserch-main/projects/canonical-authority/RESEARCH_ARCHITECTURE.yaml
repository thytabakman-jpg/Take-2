purpose: >
  This is the single integrated research object representing the current paper before
  manuscript drafting. It records the paper's fixed case, current comparison method,
  current module outcomes, bounded result, current general contribution, validation
  status, and realized ceiling. Supporting registers preserve detail and history, but
  this object is the canonical answer to "what paper are we currently capable of
  writing?"

fixed_case:
  locus: Genesis 1:1
  target_proposition:
    id: I_S
    statement: >
      On the peshat advanced, Genesis 1:1 has bara Elohim as its main predication
      rather than as part of a temporal subordinate construction leading to verse 3.
  rivals:
    P_R: "not I_S"
    P_N: "I_S"
  first_order_grammar_verdict: outside_current_adjudicative_scope

research_question: >
  When canonical Jewish interpreters make incompatible factual claims, what gives a
  third-party evaluator grounds to favor one as true?

comparison_scope:
  inventory_status: purposive_non_exhaustive
  source_module_registry: research/SOURCE_MODULES.yaml
  source_identity_registry: research/SOURCE_REGISTRY.yaml
