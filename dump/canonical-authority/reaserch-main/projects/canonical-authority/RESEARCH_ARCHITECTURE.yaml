  definition: >
    A ceiling raise is a spine-preserving change that yields a strictly stronger
    current research object through stronger characterization, weaker assumptions,
    wider defensible scope, explanatory compression, robustness, independent
    validation, or higher publication-level significance while preserving protected
    earlier results.
  realization_rule: >
    A ceiling-raising insight is not realized merely because it appears in a chat,
    audit, discovery map, or ceiling register. It becomes part of the actual paper
    architecture only when it is promoted into this RESEARCH_ARCHITECTURE.yaml, an
    explicit strict-gain relation to the previous architecture is recorded, protected
    results pass regression, and the artifact version is incremented.
  non_counting_rule: >
    Another field, source, analogy, distinction, notation system, or validation case
    does not count as a ceiling raise unless it supports a strictly stronger result on
    the same spine.
  promotion_requirements:
    - explicit_spine_attachment
    - explicit_baseline_and_successor
    - explicit_strict_gain_relation
    - defensibility
    - non_regression_against_protected_results
    - net_gain_over_added_complexity
    - anti_rescue_independent_admission_basis
    - durable_update_to_this_artifact
    - dependency_snapshot_reconciled
    - artifact_registry_version_and_blob_reconciled
    - state_and_manuscript_dependents_reconciled

