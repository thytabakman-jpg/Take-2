    - E_REEM


declared_inquiry_frame:
  notation: "Phi = <A,tau,e>"
  components:
    A: admitted_source_corpus
    tau: fixed_truth_target
    e: evaluator_regime
  function: >
    The frame declares which corpus, proposition pair, and evaluator-relative warrant
    question are being assessed. Changing a frame coordinate can define a different
    inquiry and is not automatically source supplementation.

provenance_factorization:
  source_attributable_content: S
  inferential_coordinates: "Psi = <rho,beta,kappa,...>"
  verdict_schema: "V = F(S;Phi,Psi)"
  attribution_rule: >
    Holding S and Phi fixed, a verdict difference produced by materially admissible
    variation in representation, bridge, supplementation, composition, or other
    inferential coordinates is not attributable to S alone.
  consequence: >
    Source-only verdicts, mixed-provenance verdicts, and evaluator-indexed verdicts
    remain analytically distinct.

method_architecture:
  name: fixed_target_route_and_case_comparison

  typed_setup:
    label: PROFILE
    status: required_setup_not_independent_success_conjunct
    function: >
      Reconstruct the candidate religious authority or knowledge structure in its
      native context and identify the typed output it actually supplies.
    compression_result: >
      PROFILE remains a mandatory semantic job, but a well-formed TRACE already
      presupposes the source node and native output. PROFILE therefore does not need
      to appear as a fourth independent condition of route-level adjudicative success.

  source_package_control:
    admitted_space: AdmPkg_A
    rule: >
      TRACE may operate over an independently admissible nonempty package of source
      structures drawn from A. Package membership alone does not license joint use:
      every material cross-source bridge or supplementation relation requires
      independent grounds.
    singleton_embedding: >
      Existing singleton route analysis is preserved as the special case X={H_i}.

  route_level_characterization:
    target: "{P_R, P_N}"
    bearer: independently_admissible_source_package
    gates:
      - id: TRACE
        function: >
          Establish a licensed and source-attributable relation from the typed native
          outputs of an admissible source package X to the fixed truth target.
      - id: DISCRIMINATE
        function: >
          Establish that the traced relation gives asymmetric truth-directed support
          to one rival rather than the other.
      - id: RECOGNIZE
        function: >
          Establish that evaluator e has warranted epistemic grounds for identifying,
          authenticating, and relying on that discriminator. Social recognizability
          can support this job but cannot substitute for warrant by status alone.
    source_ground_factorization: >
      SourceGround(X,tau,Delta) iff TRACE(X,tau,Delta) and
      DISCRIMINATE(Delta,tau).
    evaluator_uptake: >
      Usable_e(Delta,tau) iff RECOGNIZE_e(Delta,tau).
    formal_candidate: >
      PackageGround_e(X,tau) iff X is in AdmPkg_A and there exists Delta such that
      TRACE(X,tau,Delta), Delta discriminates the rivals concerning tau, and evaluator
      e can warrantedly recognize and use Delta.
    status: candidate_minimal_job_decomposition_with_package_bearer
    support: >
      Hostile testing preserved TRACE, DISCRIMINATE, and RECOGNIZE as distinct jobs
      but falsified the stronger singleton-only corpus obstruction: individually
      incomplete source structures can in principle jointly complete TRACE. Package
      TRACE repairs that defect without adding another reader-facing stage.

  case_level_selection:
    label: COMPOSE
    status: required_when_multiple_completed_grounds_materially_conflict
    input: completed_target_indexed_grounds
    function: >
      Apply an independently licensed aggregation or defeat relation to several
      already-established target-indexed grounds. COMPOSE is distinct from package
      TRACE: package TRACE can use several sources to establish one ground, whereas
      COMPOSE operates over several completed grounds.
    admissible_specification_set: >
      K_e(G,tau) = {kappa | Adm_e(kappa | G,tau)}.
    kappa_relative_selection: >
      A verdict may be reported relative to one independently licensed kappa.
    robust_selection: >
      An unqualified strict case verdict requires the same strict warranted ordering
      across every materially admissible kappa in K_e(G,tau). Where admissible kappas
      conflict, the strongest result remains relative, partial, tied, or unresolved
      unless a further independently licensed relation narrows K.
    selector_attribution: >
      Holding completed grounds G fixed, a verdict difference caused by varying kappa
      cannot be attributed to G alone.
    current_case_status: dormant
    reason: >
      Post-recovery package-level regression finds no currently admissible source
      package that completes TRACE to I_S, so no completed grounds exist for COMPOSE
      to aggregate in the fixed case.

diagnostic_expansion:
