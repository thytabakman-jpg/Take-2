  - id: CANON:CR:032
    name: frame_contribution_factorization
    spine_attachment: [Q, R, B, C]
    status: accepted_current
    article_visibility: compact_methodological_control
    strict_gain: >
      Distinguishes inquiry-frame coordinates from inferential contributions. The
      admitted corpus A, target tau, and evaluator e define the declared frame Phi;
      representation, bridge, supplementation, composition, and related coordinates
      belong to inferential machinery Psi whose outcome-material contribution must be
      attributed separately.
    formal_candidate: >
      V = F(S;Phi,Psi), with Phi=<A,tau,e>. Holding source-attributable content S and
      Phi fixed, a verdict difference produced by materially admissible variation in
      Psi is not attributable to S alone.
    net_gain: high_explanatory_compression

  - id: CANON:CR:033
    name: source_ground_and_evaluator_uptake_factorization
    spine_attachment: [Q, R, B, C]
    status: accepted_current
    article_visibility: central_methodological_control
    strict_gain: >
      Separates what a source package contributes from whether evaluator e has
      warranted grounds to identify and use that contribution.
    formal_candidate: >
      SourceGround(X,tau,Delta)=TRACE(X,tau,Delta) AND DISCRIMINATE(Delta,tau);
      Usable_e(Delta,tau)=RECOGNIZE_e(Delta,tau); evaluator-usable route success
      requires both.
    consequence: >
      Etic scholarly analysis can characterize emic evaluator-relative usability
      without the scholar personally accepting every background premise.
    net_gain: high

  - id: CANON:CR:034
    name: source_package_TRACE
    spine_attachment: [H_F, R, B]
    status: accepted_current
    article_visibility: central_repair_if_package_issue_is_raised
    strict_gain: >
      Repairs the singleton-only route model exposed by maximum-hostility testing.
      Several individually incomplete source structures may jointly establish one
      source-to-target ground, so TRACE must permit independently admissible source
      packages while preserving singleton routes as a special case.
    formal_candidate: >
      PackageGround_e(X,tau) iff X is an independently admissible source package and
      there exists Delta such that TRACE(X,tau,Delta), Delta discriminates the rivals,
      and evaluator e can warrantedly recognize and use Delta.
    noncollapse_with_COMPOSE: >
      Package TRACE creates one completed target-indexed ground from several source
      structures; COMPOSE aggregates or defeats several already-completed grounds.
    evidence:
      - audits/CANONICAL_AUTHORITY_SOURCE_PACKAGE_TRACE_AUDIT_2026-09-22.md
    net_gain: very_high_because_it_repairs_a_real_hostile_counterexample

  - id: CANON:CR:035
    name: package_level_TRACE_obstruction
    spine_attachment: [H_F, R, B, C]
    status: accepted_current_bounded
