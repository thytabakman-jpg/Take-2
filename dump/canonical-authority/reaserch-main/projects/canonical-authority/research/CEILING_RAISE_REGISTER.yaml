    contribution: >
      Preserve C as the macro-node but distinguish C_case, C_method,
      C_disciplinary, and C_publication with explicit dependency direction.
    net_gain: high_anti_bloat

  - id: CANON:CR:022
    name: cross_tradition_structural_holdouts
    spine_attachment: [H_F, R, B, C]
    status: accepted_support
    article_visibility: validation_support_not_case_expansion
    contribution: >
      Exploratory stress tests across papal/magisterial infallibility, Sunni hadith
