    consequence: >
      While the package obstruction holds, evaluator variation and COMPOSE cannot
      change the fixed case result because the case is blocked upstream at TRACE.
    reopen_conditions:
      - admitted_module_change
      - material_source_recovery
      - new_source_grounded_cross_module_bridge
      - material_target_change
      - material_primary_source_reinterpretation
    evidence:
