    effect: >
      H_R remains the strongest case-proximate route but still fails TRACE.
    net_gain: pass


  - id: CANON:CR:024
    name: admissible_composition_set_and_robust_selection
    spine_attachment: [B, C]
    status: accepted_current
    article_visibility: central_if_general_characterization_claimed
    strict_gain: >
      Replaces an underconstrained existential COMPOSE rule with a distinction between
      kappa-relative selection and unqualified selection invariant across the
      materially admissible composition-specification family.
    formal_candidate: >
      K_e(G,tau) = {kappa | Adm_e(kappa | G,tau)}. A kappa-relative verdict reports
      what follows under one licensed specification; an unqualified strict verdict
      requires the same strict ordering across every materially admissible kappa.
    novelty_boundary: >
      The existential/universal robustness pattern is not claimed as novel. The
      contribution lies in its role inside the source-grounded religious-authority
      architecture.
    evidence:
      - audits/CANONICAL_AUTHORITY_CEILING_CONSOLIDATION_2026-09-22.md
    net_gain: high

  - id: CANON:CR:025
    name: composition_selector_attribution
    spine_attachment: [R, B, C]
    status: accepted_current
    article_visibility: central_implication_or_compact_method_result
    strict_gain: >
      Holding route grounds fixed while varying COMPOSE isolates selecting information
      introduced by the composition layer rather than by the source routes.
    formal_candidate: >
      If G is fixed and COMPOSE_kappa1(G) != COMPOSE_kappa2(G), the output difference
      cannot be attributed to the fixed source-route grounds alone.
    evidence:
      - audits/CANONICAL_AUTHORITY_CEILING_CONSOLIDATION_2026-09-22.md
    net_gain: high

  - id: CANON:CR:026
