schema_version: 0.1
project_id: canonical-authority
register: ceiling_raise
authority_status: canonical_working

definition: >
  A ceiling-raising move adds or extracts material that increases the strongest
  defensible scholarly contribution of the project while preserving its core
  identity and dependency spine.

criteria:
  P:
    name: preservation
    test: preserves the paper goal, fixed case, and controlling spine
  A:
    name: attachment
    test: attaches to a precise existing spine node or dependency
  U:
    name: upward_contribution
    test: >
      increases at least one publication-relevant dimension such as theoretical
      significance, generality, novelty, explanatory power, interdisciplinary
      relevance, robustness, or importance
  D:
    name: defensibility
    test: the stronger claim is actually supported and does not outrun evidence
  N:
    name: net_gain
    test: >
      expected scholarly gain exceeds added scope drift, complexity, research
      burden, reviewer attack surface, and word-count cost

realization_semantics:
  candidate_location: this_register
  realized_object: ../RESEARCH_ARCHITECTURE.yaml
  rule: >
    A move can be accepted as a ceiling-raise candidate or research result in this
    register without yet changing the actual paper architecture. It is realized
    only when its surviving effect is integrated into RESEARCH_ARCHITECTURE.yaml,
    that artifact's version is incremented when required, and affected dependents
    are reconciled.
  anti_orphan_rule: >
    A move marked article-visible or central that is absent from the current
    RESEARCH_ARCHITECTURE.yaml is a promotion gap and must not be treated as part of
    the current paper.

idealization:
  statement: >
    Prefer the admissible move with the greatest defensible increase in scholarly
    significance, novelty, generality, or robustness per unit of scope drift,
    complexity, research burden, and review risk, subject to spine preservation.
  note: qualitative control; no unsupported numerical scoring is implied

moves:
  - id: CANON:CR:001
    name: target_relative_authority
    spine_attachment: [Q, H_F, R, C]
    status: accepted_current
    article_visibility: central
    contribution: >
      Distinguish the kind of output an authority mechanism actually determines
      from the descriptive truth target at issue. Authority success is not
      epistemically portable by status alone.
    imported_support:
      - contemporary epistemic-authority literature
      - religious-authority typology
      - PD target/result typing

  - id: CANON:CR:002
    name: licensed_transfer_and_attribution
    spine_attachment: [R, C]
    status: accepted_current
    article_visibility: central
    contribution: >
      Separate source-grounded content from bridge machinery and attribute a
      resulting selector to the augmented system when the bridge is not licensed
      by the source or relevant interpretive framework.
    imported_support:
      - PD:G2A
      - source-attribution and application-versus-supplementation work

  - id: CANON:CR:003
    name: third_party_warrant_layer
    spine_attachment: [Q, B, C]
    status: accepted_current
    article_visibility: central
    contribution: >
      Distinguish existence of a truth-relevant discriminator from a later
      evaluator's grounds for identifying, authenticating, scoping, and relying
      on that discriminator in this case.
    effect_on_B: "B** = T + L + I + W"

  - id: CANON:CR:004
    name: bearer_and_representation_control
    spine_attachment: [A, R]
    status: accepted_support
    article_visibility: selective
    contribution: >
      Distinguish the evidential bearer under discussion: consonantal text,
      Masoretic realization, Targumic reading, recension, commentator's report,
      printed text, or later authority claim.

  - id: CANON:CR:005
    name: indexed_pluralism
    spine_attachment: [Q, H_F, C]
    status: accepted_support
    article_visibility: selective
    contribution: >
      Show that determinate legitimacy or binding practice can coexist with
      unresolved descriptive truth because the determination relations are indexed
      to different targets.

  - id: CANON:CR:006
    name: inverse_problem_of_religious_outcomes
    spine_attachment: [R, C]
    status: promising_support
    article_visibility: discussion_only_unless_needed
    contribution: >
      An observed institutional or canonical endpoint does not by itself identify
      the epistemic mechanism that generated or warrants it.

  - id: CANON:CR:007
    name: explicit_PD_framework_in_article
    spine_attachment: [R]
    status: rejected_for_current_article
    article_visibility: none
    reason: >
      Making the paper defend the unpublished PD framework itself would add a
      second publication burden, expand reviewer attack surface, and risk replacing
      the Jewish/religious-authority paper with a PD methods paper.
    use_instead: >
      Use PD-derived distinctions under the hood and state only the independently
      defensible methodological distinctions needed by the article.

  - id: CANON:CR:008
    name: inferential_not_historical_causal_path
    spine_attachment: [Q, R]
    status: accepted_support
    article_visibility: brief_method_clarification
    contribution: >
      Clarify that the typed source-to-case path represents inferential or
      justificatory dependence, not a historical-causal account of why Rashi,
      Ramban, or later authorities came to hold their positions.
    imported_support:
      - family-systems circular-causality stress test
    net_gain: pass_if_compact

  - id: CANON:CR:009
    name: multi_coordinate_transfer_test
    spine_attachment: [R, B]
    status: accepted_research_control
    article_visibility: implicit_unless_case_requires_detail
    contribution: >
      Stress-test licensed transfer across separately typed coordinates such as
      native domain, native function, target proposition, bearer, evaluator, and
      evidential role rather than treating transfer as one undifferentiated arrow.
    imported_support:
      - educational transfer-of-learning taxonomy
      - PD indexed characterization
    net_gain: pass_under_the_hood

  - id: CANON:CR:010
    name: attribute_indexed_authenticity
    spine_attachment: [A, Q, R, C]
    status: conditional_support
    article_visibility: only_if_authenticity_language_remains_live
    contribution: >
      Treat authenticity as attribute-indexed. Authenticity of provenance,
      continuity, material identity, reception, or function does not by itself
      establish truth of every proposition carried by the authentic bearer.
    imported_support:
      - art-conservation authenticity literature
      - existing source-attribution controls
    net_gain: conditional

  - id: CANON:CR:011
    name: fixed_case_as_worked_demonstration
    spine_attachment: [A, R, C]
    status: manuscript_strategy
    article_visibility: structural_not_theoretical
    contribution: >
      Use the fixed Rashi-Ramban dispute as a worked demonstration of the general
      authority-transfer problem. Depth of control over one case is treated as the
      mechanism by which the general method becomes inspectable, not as a claim that
      one case statistically represents all canonical disagreement.
    imported_support:
      - worked-example research in education
    net_gain: pass_for_manuscript_design

  - id: CANON:CR:012
    name: religious_knowledge_structures
    spine_attachment: [Q, H_F, R, C]
    status: accepted_current
    article_visibility: central
    contribution: >
      Situate the source modules inside the emerging sociology of religious
      knowledge: religious institutions, texts, interpreters, and practices can
      produce, transmit, classify, authenticate, or authorize different kinds of
      knowledge without each function supplying proposition-specific adjudication.
    imported_support:
      - sociology_of_religious_knowledge
      - social_epistemology_of_religion
    net_gain: high

  - id: CANON:CR:013
    name: fixed_target_comparison
    spine_attachment: [A, H_F, R, C]
    status: accepted_current
    article_visibility: central
    contribution: >
      Treat the paper as a controlled comparative method: hold one truth-apt
      proposition pair fixed, reconstruct heterogeneous religious mechanisms in
      native context, and compare only what each contributes to the explicit target.
      This preserves difference while supplying a common tertium comparationis.
    imported_support:
      - comparative_method_in_religious_studies
    net_gain: high

  - id: CANON:CR:014
    name: philosophy_of_religious_studies_positioning
    spine_attachment: [Q, R, C]
    status: accepted_current
    article_visibility: central
    contribution: >
      Frame the conceptual analysis of religious authority as metatheoretical work
      within religious studies rather than as straight philosophy of religion. The
      object is the inferential and methodological use of authority categories in an
      empirically grounded religious case.
    imported_support:
      - Religion_2024_philosophy_of_religious_studies_issue
    net_gain: high_for_Religion_fit

  - id: CANON:CR:015
    name: canonicality_as_functional_status
    spine_attachment: [H_F, R, C]
    status: accepted_support
    article_visibility: selective
    contribution: >
      Treat canonicality as a status that can perform memory, identity, circulation,
      legitimacy, and community functions. A separate bridge is required before
      canonical status can function as proposition-specific truth evidence.
    imported_support:
      - cultural_memory
      - canon_archive_studies
      - scripturalism
    net_gain: pass

  - id: CANON:CR:016
    name: socially_recognizable_authority
    spine_attachment: [A, Q, B, C]
    status: accepted_current
    article_visibility: central_support
    contribution: >
      Expand W in B** beyond private access to evidence: religious authority is
      socially mediated through recognizable bearers, texts, institutions, practices,
      and interpretive communities, so third-party use requires a socially and
      evidentially identifiable authority relation.
    imported_support:
      - sociology_of_religious_authority
      - scripture_as_external_authority
      - lived_and_practice_approaches
    net_gain: pass

  - id: CANON:CR:017
    name: etic_emic_normativity_boundary
    spine_attachment: [Q, B, C]
    status: accepted_current
    article_visibility: central_methodological_control
    contribution: >
      Keep the truth-directed target internal to the audited religious structures
      while the scholar performs second-order analysis of what those structures
      establish. The paper does not itself decide theological truth or prescribe
      belief.
    imported_support:
      - normativity_in_religious_studies
      - philosophy_of_religious_studies
    net_gain: high_for_Religion_fit

  - id: CANON:CR:018
    name: four_stage_compression
    spine_attachment: [H_F, R, B, C]
    status: superseded_by_CANON_CR_019
    article_visibility: historical_predecessor
    contribution: >
      Compress the current source-to-adjudication architecture into four
      reader-facing operations: PROFILE the source structure's native output,
      TRACE a licensed and source-attributable path to the fixed target,
      DISCRIMINATE whether that path gives asymmetric truth-directed support between
      the rivals, and RECOGNIZE whether the third-party evaluator has grounds to
      identify and use the discriminator.
    formal_candidate: >
      Adj_e(H_i,tau) iff there exists Delta_i^tau such that Delta_i^tau is
      traceable to H_i, discriminates the fixed rival propositions in tau, and is
      warrantedly recognizable by evaluator e.
    compression_effect: >
      Native domain, function, bearer, provenance, bridge license, authenticity,
      truth relevance, proposition linkage, case instantiation, and social
      recognizability remain available as diagnostic coordinates rather than
      independent reader-facing primitives.
    imported_support:
      - transportability_and_external_validity
      - social_epistemology_and_expert_disagreement
      - database_and_archival_provenance
      - Bayesian_evidence
      - explanatory_unification
      - minimum_description_length
      - modular_systems_architecture
    net_gain: high
    regression_status: preserves_all_current_ceiling_results

  - id: CANON:CR:019
    name: typed_setup_plus_three_route_gates
    spine_attachment: [H_F, R, B, C]
    status: accepted_current
    article_visibility: central_method
    baseline_object: CANON:ARCH:001_v1.0.2
    strict_gain: >
      Refines the four-stage procedural method by showing that PROFILE is required
      typed setup rather than an independent success conjunct, while hostile deletion
      tests preserve TRACE, DISCRIMINATE, and RECOGNIZE as distinct necessary
      route-level jobs. The successor gives a conditional sufficiency characterization
      for evaluator-usable pro tanto grounds without losing any current case result.
    contribution: >
      After typed source setup, a religious authority route supplies evaluator-usable
      pro tanto grounds only when there is a licensed/source-attributable TRACE to the
      fixed target, the traced relation DISCRIMINATES the rivals concerning truth, and
      the evaluator can RECOGNIZE the discriminator on warranted grounds.
    formal_candidate: >
      RouteGround_e(H_i,tau) iff there exists Delta_i^tau such that Delta_i^tau is
      traceable to H_i, discriminates tau, and is warrantedly recognizable by e.
    regression_status: preserves_case_results_with_H_X_stopping_stage_refined
    net_gain: high

  - id: CANON:CR:020
    name: multi_route_composition_requirement
    spine_attachment: [B, C]
    status: accepted_current
    article_visibility: central_if_general_characterization_claimed
    baseline_object: CANON:ARCH:001_v1.0.2
    strict_gain: >
      Repairs a sufficiency defect in the prior architecture. Two individually valid
      route-level discriminators can point in opposite directions, so route success
      does not itself entail all-things-considered case selection.
    contribution: >
      Decisive case selection over multiple successful routes requires an explicit,
      independently licensed, non-outcome-driven composition or defeat relation.
    formal_candidate: >
      CaseSelect_e(Hset,tau) iff COMPOSE_A({Delta_i | RouteGround_e(H_i,tau)})
      yields a strict warranted ordering of the rivals.
    current_case_effect: >
      Dormant in the current Rashi-Ramban corpus because no admitted route yet
      reaches a complete usable discriminator.
    net_gain: high_for_generality

  - id: CANON:CR:021
    name: contribution_layer_decomposition
    spine_attachment: [C]
    status: accepted_current
    article_visibility: research_and_manuscript_control
    baseline_object: CANON:ARCH:001_v1.0.2
    strict_gain: >
      Prevents case-result, general method, disciplinary significance, and journal
