schema_version: 0.1
project_id: canonical-authority
register: discovery_map
authority_status: canonical_working

roles: [core_argument, support, source_control, research_control_only, future_paper, excluded, unresolved]

discoveries:
  - id: CANON:D:001
    statement: >
      Rashi and Ramban can be represented as rival claims over whether Genesis 1:1
      itself makes an independent initial-creation predication on the peshat advanced.
    spine_attachment: [A]
    role: core_argument
    status: current

  - id: CANON:D:002
    statement: Explanation of disagreement and adjudication of truth are distinct jobs.
    spine_attachment: [Q, R]
    role: core_argument
    status: current

  - id: CANON:D:003
    statement: >
      Legitimacy, binding practice, provenance, explanation, authentication, and
      descriptive truth are distinct target/result types.
    spine_attachment: [Q, H_F, R]
    role: core_argument
    status: current

  - id: CANON:D:004
    statement: >
      Heterogeneous Jewish mechanisms must be reconstructed in their native domains
      and functions before any transfer to the Rashi-Ramban case is assessed.
    spine_attachment: [H_F, R]
    role: core_argument
    status: current

  - id: CANON:D:005
    statement: >
      Source content and project-level application are distinct; application can
      introduce bridge content not supplied by the source itself.
    spine_attachment: [R]
    role: core_argument
    status: current

  - id: CANON:D:006
    statement: >
      A selector introduced only through an unlicensed bridge is attributable to
      the augmented analysis rather than retroactively to the source.
    spine_attachment: [R, C]
    role: core_argument
    status: current

  - id: CANON:D:007
    statement: >
      Truth relevance alone is insufficient; the mechanism must link to the target
      proposition and instantiate an asymmetry in the fixed case.
    spine_attachment: [B]
    role: core_argument
    status: current

  - id: CANON:D:008
    statement: >
      A genuine truth-relevant asymmetry can exist without yet giving a later
      evaluator warranted grounds for identifying and relying on it.
    spine_attachment: [Q, B, C]
    role: core_argument
    status: current

  - id: CANON:D:009
    statement: >
      Authority can settle normative or institutional outputs while remaining
      compatible with factual error.
    spine_attachment: [H_F, R, C]
    role: support
    status: current

  - id: CANON:D:010
    statement: >
      A protected-reception model can classify a dispute as outside the protected
      category without selecting either rival proposition.
    spine_attachment: [H_F, R]
    role: support
    status: current

  - id: CANON:D:011
    statement: >
      Authenticated privileged access is a positive control showing that a
      traditional mechanism can in principle supply genuine truth-directed force.
    spine_attachment: [H_F, B]
    role: core_argument
    status: current

  - id: CANON:D:012
    statement: >
      Ramban's Maaseh Bereishis tradition is highly case-proximate, but the link
      from that received knowledge to the exact syntactic proposition I_S remains
      to be established.
    spine_attachment: [H_F, R, B]
    role: core_argument
    status: current

  - id: CANON:D:013
    statement: >
      Reem's recension proposal can explain the shape of the disagreement without
      converting explanation into grammatical adjudication.
    spine_attachment: [A, R]
    role: support
    status: current

  - id: CANON:D:014
    statement: >
      Onkelos is best typed as first-order case evidence unless a separate
      source-grounded authority theory is supplied.
    spine_attachment: [A, R]
    role: source_control
    status: current

  - id: CANON:D:015
    statement: >
      Multiple legitimate or binding outputs under one index do not establish
      descriptive truth indeterminacy under every index.
    spine_attachment: [Q, H_F, C]
    role: support
    status: current

  - id: CANON:D:016
    statement: >
      Observed canonical or institutional success does not by itself identify the
      epistemic mechanism that generated or warrants the outcome.
    spine_attachment: [R, C]
    role: support
    status: promising

  - id: CANON:D:017
    statement: >
      Bearer identity matters: text, vocalization, recension, translation,
      commentator report, and later authority claim are not automatically one
      evidential object.
    spine_attachment: [A, R]
    role: source_control
    status: current

  - id: CANON:D:018
    statement: >
      The admitted source-module inventory remains open; failure of the audited
      modules does not license a universal negative about Jewish adjudication.
    spine_attachment: [H_F, C]
    role: research_control_only
    status: current

  - id: CANON:D:019
    statement: >
      The paper's strongest defensible novelty is the fixed-case comparative
      source-to-target bridge analysis, not the generic fact that Jewish factual
      disagreement, pluralism, or authority have been studied.
    spine_attachment: [C]
    role: core_argument
    status: current

  - id: CANON:D:020
    statement: >
      Explicit presentation of PD as a second formal framework would create a
      second publication burden and is not required for the current article.
    spine_attachment: [R]
    role: excluded
    status: current

  - id: CANON:D:021
    statement: >
      The R pathway is inferential and justificatory, not a historical-causal model
      of how the rival views or authority structures arose.
    spine_attachment: [Q, R]
    role: support
    status: current

  - id: CANON:D:022
    statement: >
      Licensed transfer can be result-sensitive along several coordinates at once,
      including domain, function, target proposition, bearer, evaluator, and
      evidential role.
    spine_attachment: [R, B]
    role: research_control_only
    status: current

  - id: CANON:D:023
    statement: >
      Authenticity is attribute-indexed; authenticity of provenance or continuity
      does not itself establish truth of each proposition carried by the authentic
      bearer or tradition.
    spine_attachment: [A, Q, R, C]
    role: support
    status: conditional

  - id: CANON:D:024
    statement: >
      The fixed Rashi-Ramban case can function as a worked demonstration of the
      general transfer problem without claiming representativeness of all Jewish
      disagreement.
    spine_attachment: [A, R, C]
    role: support
    status: manuscript_strategy

  - id: CANON:D:025
    statement: >
      The source modules can be analyzed as functionally different structures for
      producing, transmitting, classifying, authenticating, or authorizing religious
      knowledge without assuming that each function supplies factual adjudication.
    spine_attachment: [Q, H_F, R, C]
    role: core_argument
    status: current

  - id: CANON:D:026
    statement: >
      A fixed target proposition-pair can serve as the tertium comparationis for
      comparing heterogeneous religious authority structures while preserving their
      native contexts and functions.
    spine_attachment: [A, H_F, R, C]
    role: core_argument
    status: current

  - id: CANON:D:027
    statement: >
      The paper's conceptual analysis can be located within philosophy of religious
      studies when it evaluates the use of concepts and methods in empirically
      grounded religious-studies inquiry rather than deciding religious truth.
    spine_attachment: [Q, R, C]
    role: core_argument
    status: current

  - id: CANON:D:028
    statement: >
      Canonicality is a functional status with possible memory, identity,
      circulation, legitimacy, and community effects; those functions do not by
      themselves establish proposition-specific truth.
    spine_attachment: [H_F, R, C]
    role: support
    status: current

  - id: CANON:D:029
    statement: >
      Third-party warrant includes socially recognizable authority relations:
      bearers, institutions, texts, practices, and interpretive communities help
      determine whether an asserted authority relation is identifiable and usable.
    spine_attachment: [A, Q, B, C]
    role: support
    status: current

  - id: CANON:D:030
    statement: >
      The scholar can analyze internal truth-directed religious structures
      second-order without endorsing or deciding the theological truth of the rival
      claim; emic target and etic analysis must remain distinct.
    spine_attachment: [Q, B, C]
    role: core_argument
    status: current

  - id: CANON:D:031
    statement: >
      The current R->B conceptual density mixes source-description coordinates,
      transfer diagnostics, adjudicative success conditions, evaluator-access
      conditions, and audit outputs at one level.
    spine_attachment: [R, B, C]
    role: core_argument
    status: current

  - id: CANON:D:032
    statement: >
      The source-to-adjudication method can be compressed without loss into four
      reader-facing operations: PROFILE, TRACE, DISCRIMINATE, and RECOGNIZE.
    spine_attachment: [H_F, R, B, C]
    role: core_argument
    status: current

  - id: CANON:D:033
    statement: >
      Truth relevance, proposition-specific linkage, case instantiation, and
      asymmetric selection are diagnostics of one target-specific discriminatory
      relation rather than four independent manuscript-level primitives.
    spine_attachment: [B]
    role: core_argument
    status: current

  - id: CANON:D:034
    statement: >
      Bearer, native domain, native function, provenance, authenticity, bridge
      license, and source attribution are diagnostics of source profiling and
      traceability rather than independent adjudicative success conditions.
    spine_attachment: [H_F, R]
    role: core_argument
    status: current

  - id: CANON:D:035
    statement: >
      Evaluator warrant and social recognizability can be treated as one
      recognizability/use stage at reader-facing level while retaining finer
      diagnostics underneath.
    spine_attachment: [B, C]
    role: core_argument
    status: current

  - id: CANON:D:036
    statement: >
      Future ceiling passes no longer earn central status merely by adding another
      diagnostic coordinate; they must defeat or further compress the four-stage
      reduction, expand its defensible domain, or materially change publication
      ceiling.
    spine_attachment: [C]
    role: research_control_only
    status: current

  - id: CANON:D:037
    statement: >
      PROFILE is a required semantic/setup job but not an independent adjudicative
      success conjunct; a well-typed TRACE already presupposes a reconstructed source
      node and native output.
    spine_attachment: [H_F, R, B]
    role: core_argument
    status: current

  - id: CANON:D:038
    statement: >
      TRACE, DISCRIMINATE, and RECOGNIZE survive hostile deletion and collapse tests
      as distinct route-level jobs for evaluator-usable authority-based grounds.
    spine_attachment: [R, B]
    role: core_argument
    status: current

  - id: CANON:D:039
    statement: >
      Route-level success does not entail all-things-considered case selection when
      multiple successful routes conflict; case selection requires a separately
      licensed composition or defeat relation.
    spine_attachment: [B, C]
    role: core_argument
    status: current

  - id: CANON:D:040
    statement: >
      The C macro-node contains distinct dependency layers: bounded case result,
      general method, disciplinary significance, and publication ceiling.
    spine_attachment: [C]
    role: research_control_only
    status: current

  - id: CANON:D:041
    statement: >
      Four structurally different cross-tradition authority systems preserve the
      setup/TRACE/DISCRIMINATE/RECOGNIZE job structure without requiring a new
      route-level primitive, while exposing the multi-route composition problem.
    spine_attachment: [H_F, R, B, C]
    role: support
    status: exploratory_holdout

  - id: CANON:D:042
    statement: >
      Ramban's Genesis 1:1 comment explicitly combines received/esoteric creation
      knowledge with a separately articulated simple/peshat explanation and
      way-of-truth reading; current evidence does not identify I_S itself as the
      received esoteric item.
    spine_attachment: [H_F, R]
    role: source_control
    status: current

  - id: CANON:D:043
    statement: >
      The targeted nearest-neighbor review located close work on third-party
      disagreement, factual disagreement in Jewish law, religious authority,
      prophetic discernment, comparison, and religious knowledge, but no direct
      predecessor for the combined fixed-target trace-discriminate-recognize plus
      multi-route composition architecture.
    spine_attachment: [C]
    role: support
    status: bounded_to_targeted_review


  - id: CANON:D:044
    statement: >
      An existential claim that some admissible-looking COMPOSE rule selects a rival
      is underconstrained; an unqualified case verdict requires agreement across the
      materially admissible composition-specification family, while rule-relative
      verdicts remain separately reportable.
    spine_attachment: [B, C]
    role: core_argument
    status: current

  - id: CANON:D:045
    statement: >
      Holding completed source-route grounds fixed while changing COMPOSE isolates
      selector information introduced by the composition layer rather than by the
      source routes.
    spine_attachment: [R, B, C]
    role: core_argument
    status: current

  - id: CANON:D:046
    statement: >
      A prospectively preregistered Sikh-authority structural holdout preserved the
      current route jobs without a rescue primitive and independently displayed
      differentiated scriptural, interpretive, communal, and institutional authority
      functions.
    spine_attachment: [H_F, R, B, C]
    role: support
    status: prospective_holdout_pass

  - id: CANON:D:047
    statement: >
      Backend recovery has converted article-facing source identity into stable source
      records for the central fixed-case and source modules; remaining edition and
      source gates stay explicit rather than being silently filled.
    spine_attachment: [H_F, R, C]
    role: source_control
    status: current

  - id: CANON:D:048
    statement: >
      The strongest novelty position is an intersection claim rather than novelty of
      each component: no direct predecessor was located in the reviewed comparator
      corpus for the combined fixed-target source-trace, rival-discrimination,
      evaluator-uptake, separate-composition, selector-attribution architecture.
    spine_attachment: [C]
    role: support
    status: bounded_to_reviewed_comparator_corpus

  - id: CANON:D:049
    statement: >
      Publication-value optimization is a constrained research-control problem:
      spine-preserving moves must add defensible scholarly value beyond the scope,
      complexity, word-count, and reviewer-attack burden they introduce.
    spine_attachment: [C]
    role: research_control_only
    status: current_research_control

  - id: CANON:D:050
    statement: >
      The broader authority contribution can be derived from the fixed case: the
      audited mechanisms produce different native outputs, so truth-directed transfer
      requires explicit target trace, discrimination, evaluator uptake, and separate
      case-level composition where completed grounds conflict.
    spine_attachment: [A, Q, H_F, R, B, C]
    role: core_argument
    status: current

  - id: CANON:D:051
    statement: >
      The strongest reader-facing architecture keeps source reconstruction in prose,
      uses TRACE, DISCRIMINATE, and RECOGNIZE as the reusable route jobs, and delays
      COMPOSE until a distinct case-level selection problem actually arises.
    spine_attachment: [H_F, R, B, C]
    role: research_control_only
    status: current_manuscript_control

  - id: CANON:D:052
    statement: >
      Selector control does not require an infinite hierarchy of meta-rules. Every
      outcome-material selector is source-attributable, explicitly evaluator-licensed
      with mixed-provenance indexing, or conclusion-invariant; otherwise the warranted
      output remains relative, partial, tied, or unresolved.
    spine_attachment: [R, B, C]
    role: core_argument
    status: current

  - id: CANON:D:053
    statement: >
      Inquiry-frame coordinates and inferential contributions are distinct.
      Phi=<A,tau,e> declares corpus, target, and evaluator; representation, bridge,
      supplementation, composition, and related machinery belong to separate
      inferential coordinates whose outcome-material contribution requires attribution.
    spine_attachment: [Q, R, B, C]
    role: core_argument
    status: current

  - id: CANON:D:054
    statement: >
      Source-side discriminatory support and evaluator uptake are distinct:
      SourceGround requires TRACE plus DISCRIMINATE, while evaluator-specific usability
      requires RECOGNIZE.
    spine_attachment: [Q, R, B, C]
    role: core_argument
    status: current

  - id: CANON:D:055
    statement: >
      The earlier inference from failure of every singleton route at TRACE to
      corpus-level TRACE failure is invalid in general because two individually
      incomplete source structures can jointly supply complementary source-grounded
      premises.
    spine_attachment: [H_F, R]
    role: research_control_only
    status: falsified_earlier_formulation

  - id: CANON:D:056
    statement: >
      TRACE must admit independently licensed source packages, not only singleton
      authority routes. Singleton analysis remains embedded as the special case of a
      one-member package.
    spine_attachment: [H_F, R, B]
    role: core_argument
    status: current

  - id: CANON:D:057
    statement: >
      Package TRACE and COMPOSE are distinct operations: package TRACE combines source
      structures to establish one target-indexed ground, whereas COMPOSE combines or
      defeats several already-established grounds.
    spine_attachment: [R, B, C]
    role: core_argument
    status: current

  - id: CANON:D:058
    statement: >
      Relative to the current reconstructed seven-module corpus, no independently
      admissible source package supplies the missing proposition-specific edge from
      received or authoritative content to I_S; the present case therefore remains
      blocked at TRACE at package level.
    spine_attachment: [H_F, R, B, C]
    role: core_argument
    status: current_bounded

  - id: CANON:D:059
    statement: >
      While the package-level TRACE obstruction holds, the bounded fixed-case result is
      invariant across evaluator regimes and COMPOSE specifications because those
      coordinates lie downstream of the current obstruction.
    spine_attachment: [Q, R, B, C]
    role: core_argument
    status: current

  - id: CANON:D:060
    statement: >
      The fixed case, general method characterization, validation/stress-test support,
      disciplinary implication, and publication positioning are distinct evidence
      layers and must not be presented as though one layer independently establishes
      the others.
    spine_attachment: [C]
    role: research_control_only
    status: current_manuscript_control

  - id: CANON:D:061
    statement: >
      After a final post-recovery package-TRACE regression, additional abstract theory
      enters the current article only when it changes the case, changes the central
      characterization, removes a material reviewer vulnerability, strictly compresses
      the visible theory, or raises publication ceiling enough to exceed its burden.
    spine_attachment: [C]
    role: research_control_only
    status: current_research_control

  - id: CANON:D:062
    statement: >
      Referee simulation localizes the strongest remaining risks to source/corpus
      execution, exact novelty wording, disciplinary calibration, and reader-facing
      clarity rather than to the fixed spine or bounded case result.
    spine_attachment: [H_F, R, B, C]
    role: research_control_only
    status: current_manuscript_control

  - id: CANON:D:063
    statement: >
      The indispensable article is materially smaller than the backend: the fixed case,
      native source reconstruction, package-aware TRACE, DISCRIMINATE, evaluator-relative
      RECOGNIZE, positive control, bounded result, authority-transfer implication, and
      compact COMPOSE boundary suffice to preserve the load-bearing contribution.
    spine_attachment: [A, Q, H_F, R, B, C]
    role: research_control_only
    status: current_manuscript_control

  - id: CANON:D:064
    statement: >
      Selector-provenance theory, full joint-authority/composition theory, and PD
      research methodology are viable follow-on research objects but are not required
      to establish the current Canonical Authority paper.
    spine_attachment: [C]
    role: future_paper
    status: routed_out_of_current_article

  - id: CANON:D:065
    statement: >
      The large ceiling gains that followed explicit spine construction are evidence
      of a representational effect: once the paper's load-bearing dependencies became
      explicit, proposed improvements could attach to precise nodes, be tested for
      preservation and net gain, and be rejected when they changed project identity.
      The spine therefore functions not only as argument compression but as a coordinate
      system for directed research improvement.
    spine_attachment: [A, Q, H_F, R, B, C]
    role: research_control_only
    status: current_method_learning

  - id: CANON:D:066
    statement: >
      The stable argument spine, reader-facing spline, and complete CANON:G0 dependency
      graph are distinct control objects. The complete G0 graph also contains evidence,
      provenance, corpus-admission, novelty, manuscript, journal-framing, submission,
      and review branches that the argument spine intentionally does not own.
    spine_attachment: [A, Q, H_F, R, B, C]
    role: research_control_only
    status: current_architecture_learning

  - id: CANON:D:067
    statement: >
      A remaining representation gap is the absence of one durable live control map
      linking goal, full dependency graph, argument spine, reader spline, current
      research object, evidence rails, audit coverage, manuscript state, and the live
      ceiling frontier. This is a candidate architecture improvement, not a new
      substantive theory claim.
    spine_attachment: [A, Q, H_F, R, B, C]
    role: research_control_only
    status: open_architecture_candidate


  - id: CANON:D:068
    statement: >
      Historical recurrence examples remain available as bounded support for the claim
      that factual disagreement occurs across canonical strata, including
      R. Akiva/R. Yishmael on Sinai/Ohel Moed particulars, R. Yochanan/Reish Lakish on
      the Flood in Eretz Yisrael, and the Shmuel ben Chofni versus Saadia/Hai Endor
      disagreement. These examples are recurrence evidence, not part of the fixed
      Rashi-Ramban case unless later manuscript needs justify their use.
    spine_attachment: [Q, C]
    role: future_support_evidence
    status: parked_not_currently_load_bearing

  - id: CANON:D:069
    statement: >
      Legacy authority-response families outside the current seven-module H[F] sample
      remain corpus-expansion candidates, including received-content, Halevi
      transmission, broad-continuity, epoch truth-priority, stronger epistemic
      authority, and independently specified authenticity-property routes. Their
      preservation does not admit them into the present purposive corpus.
    spine_attachment: [H_F, R, C]
    role: corpus_expansion_control
    status: parked_pending_independent_admission

  - id: CANON:D:070
    statement: >
      The historical broad-continuity argument about distinguishing Orthodox mesorah
      from other Jewish denominational traditions is a separate classification problem.
      It is preserved as a future project candidate and does not enter the current
      authority-transfer paper merely because it shares the word mesorah.
    spine_attachment: [C]
    role: future_project
    status: routed_out_of_current_article

  - id: CANON:D:071
    statement: >
      Specific follow-on publication candidates extracted from the current research
      include a correctness-guarantee trilemma, a traditional-discriminator
      truth-relevance paper, and a Ruach HaKodesh/factual-knowledge line using
      authentication, scope, and privileged-access distinctions. These instantiate the
      broader follow-on category already represented by CANON:D:064 and remain outside
      the current article until separately activated.
    spine_attachment: [C]
    role: future_paper
    status: routed_out_of_current_article
disposition_rule: >
  New discoveries attach to the smallest spine node they materially affect and
  receive a role before they can enter manuscript planning.

manuscript_rule: >
  Research-control-only discoveries remain available for audit and reviewer defense
  but are omitted from reader-facing prose unless they become load-bearing.


  - id: CANON:D:072
    statement: >
      The newly recovered TARGET->ADMIT->EVALUATE->COMPOSE->CONCLUDE map is not yet a
      replacement for the protected A->Q->H[F]->R->B->C argument spine. It is a
      candidate semantic factorization/refinement whose promotion requires preserved
      observables and continuation-equivalence rather than notational elegance alone.
    spine_attachment: [A, Q, H_F, R, B, C]
    role: research_control_only
    status: current_candidate_architecture

  - id: CANON:D:073
    statement: >
      Candidate-source admission and source-package admissibility are distinct, but
      package admissibility is not an unconditional macro stage before evaluation.
      It is a domain/admissibility condition on package-level TRACE, with singleton
      packages preserved as the embedded special case.
    spine_attachment: [H_F, R, B]
    role: core_argument
    status: current_candidate_architecture

  - id: CANON:D:074
    statement: >
      PROFILE remains typed semantic setup rather than an adjudicative success stage.
      The route-level success structure begins only after a source or source package
      has been reconstructed into a well-typed native-output representation.
    spine_attachment: [H_F, R, B]
    role: core_argument
    status: current_candidate_architecture

  - id: CANON:D:075
    statement: >
      The project requires three architecture views to remain distinct: the protected
      macro argument spine, the semantic factorization of the adjudication machinery,
      and the reader/execution projection. A gain in one view does not by itself
      authorize replacement of another.
    spine_attachment: [A, Q, H_F, R, B, C]
    role: research_control_only
    status: current_candidate_architecture

  - id: CANON:D:076
    statement: >
      Evidence control, validation, and research/publication control are cross-cutting
      support/control rails rather than sequential nodes in the substantive
      adjudication path.
    spine_attachment: [H_F, R, B, C]
    role: research_control_only
    status: current_candidate_architecture

  - id: CANON:D:077
    statement: >
      The current inquiry-frame notation Phi=<A,tau,e> collides with the protected
      spine's use of A for the fixed collision while using A internally for the
      admitted source corpus. The two referents require distinct symbols or explicit
      typed namespaces to prevent false identity and dependency inference.
    spine_attachment: [A, Q, H_F, R]
    role: core_argument
    status: current_candidate_architecture

  - id: CANON:D:078
    statement: >
      Admission cannot be placed downstream of an inquiry frame that already contains
      the admitted corpus. The architecture requires a pre-admission target/frame
      specification Theta, an admission operation alpha producing H, and only then a
      corpus-indexed evaluation frame Phi_H when corpus membership is a frame
      coordinate.
    spine_attachment: [Q, H_F, R]
    role: core_argument
    status: current_candidate_architecture

  - id: CANON:D:079
    statement: >
      COMPOSE is a conditional branch over multiple completed grounds, not a mandatory
      sequential predecessor of conclusion. The conclusion operator must accept a
      direct route-level/case-status input when COMPOSE is dormant and a composed
      result when multiple completed grounds require aggregation or defeat.
    spine_attachment: [B, C]
    role: core_argument
    status: current_candidate_architecture


  - id: CANON:D:080
    statement: >
      The semantic architecture is a dependency DAG rather than one serial pipeline.
      Target/frame coordinates feed several later operations; corpus admission supplies
      the candidate space; evidence controls condition source reconstruction; evaluator
      indexing enters RECOGNIZE and composition admissibility; and COMPOSE activates
      only on multiple completed grounds. The protected linear spine can therefore be
