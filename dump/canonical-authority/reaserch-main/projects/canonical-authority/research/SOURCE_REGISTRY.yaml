  - id: CANON:SRC:051
    type: peer_reviewed_book_chapter
    author_or_corpus: David Berger
    title: "Miracles and the Natural Order in Nahmanides"
    publication: "In Rabbi Moses Nahmanides (Ramban): Explorations in His Religious and Literary Virtuosity, ed. Isadore Twersky, Harvard University Press, 1983; reprinted in Cultures in Collision and Conversation, Academic Studies Press, 2011, pp. 129-151"
    status: verified_secondary
    supports: [H_R, peshat_sod_relation, target_edge_acquisition]
    note: >
      Footnote 19 directly reports Amos Funkenstein's claim that in Genesis 1:1
      Ramban's peshat and sod reach syntactical contradiction: on the way of truth,
      Elohim is not the subject but the object. Berger then argues more generally
      that Ramban often explains peshat through Kabbalistic doctrine, adducing
      other passages. This source therefore blocks any simple inference from
      received/kabbalistic Genesis 1 content to I_S.

  - id: CANON:SRC:052
    type: peer_reviewed_article
    author_or_corpus: David Shatz
    title: "Is There Science in the Bible? An Assessment of Biblical Concordism"
    publication: "Tradition 41.2 (2008)"
    status: verified_secondary
    supports: [H_R, peshat_sod_relation, target_edge_acquisition]
    note: >
      At pp. 226-227 and n. 90, Shatz quotes Berger's general peshat/sod
      characterization and reports Berger's statement that Kabbalah likewise
      provides the peshat in Genesis 1. Shatz also reports Slifkin's view that
      Ramban's mystical Genesis 1 meaning is literal. This supports a generic
      Genesis-1 peshat/Kabbalah relation but not the proposition-specific I_S edge.

  - id: CANON:SRC:053
    type: peer_reviewed_article
    author_or_corpus: Amos Funkenstein
    title: "Parshanuto ha-Tippologit shel ha-Ramban"
    publication: "Zion 45 (1980): 35-59"
    status: pending_full_text
    supports: [H_R, Genesis_1_1_peshat_sod_syntax, target_edge_acquisition]
    limitation: >
      Bibliographic identity is corroborated and the relevant claim is directly quoted by Berger with page citation, but the Funkenstein full text
      has not yet been independently inspected. Berger reports Funkenstein at
      pp. 46-47 as arguing that Genesis 1:1 is a case of syntactical contradiction
      between peshat and sod, with Elohim subject on the peshat-level reading and
      object on the way-of-truth reading.



