    audit_status: audited

  - id: JHB:G1.5
    level: G1
    parent: JHB:G0
    statement: Maintain the bounded four-page house architecture and production quality across the booklet family without forcing one universal conceptual sequence onto every booklet.
    audit_status: audited

  - id: JHB:G2.1
    level: G2
    parent: JHB:G1.5
    statement: Make each page a genuine causal learning move whose bottom question or action earns the transition to the next page.
