    level: G2
    parent: JHB:G1.5
    statement: Require the Jewish conceptual technology to be operational and the holiday material to enact or deepen that same operation rather than merely illustrate it.
    audit_status: audited

  - id: JHB:G2.3
    level: G2
    parent: JHB:G1.5
    statement: Preserve public shared inquiry, cognitive ownership, source integrity, emotional safety, and a final independent transfer or choice.
    audit_status: audited

  - id: JHB:G2.4
    level: G2
    parent: JHB:G1.5
    statement: Make artifact structure, visual grammar, physical activity, production, and render quality carry the reasoning rather than function as decoration.
    audit_status: audited

  - id: JHB:G2.5
    level: G2
    parent: JHB:G0
    statement: Use broader curriculum framework, learning theory, and methodology or validation research only when that work materially advances, repairs, validates, or unblocks the booklet program.
    audit_status: audited
