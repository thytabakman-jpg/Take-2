schema_version: 0.1
booklet_id: keva_practice
control_type: product_acceptance
authority: non_goal_operational_acceptance_control
state_ref: STATE.yaml
artifact_registry: ../ARTIFACTS.yaml
series_control: ../MASTER_CONTROL.md

purpose: >
  Keep Keva product acceptance distinct from route plausibility and repository
  integrity. A strong conceptual route does not establish that the exact artifact,
  discernment operation, activity, transfer, or mechanism passes.

gate_states:
  - pass
  - repair_required
  - open
  - empirical_pending
  - blocked

gates:
  - gate_id: KEVA-PA-01
    name: exact_artifact_identity
    status: open
    findings:
      - JHB-BLOCK-KEVA-IDENTITY
    failure_effect: block artifact-sensitive acceptance and repair-mode classification

  - gate_id: KEVA-PA-02
    name: discernment_criterion
    status: open
    findings:
      - JHB-KEVA-001
    failure_effect: block claim that the booklet supplies a public criterion for the deliberate response that fits the facts

  - gate_id: KEVA-PA-03
    name: holiday_embodiment
    status: pass
    evidence:
      - KEVA-E04
    scope_note: route-level control only; exact rendered-artifact verification remains gated by KEVA-PA-01
    failure_effect: block repaired-product acceptance if later artifact evidence defeats the route-level result

  - gate_id: KEVA-PA-04
    name: activity_enactment
    status: open
    findings:
      - H2-INFO-001
    failure_effect: block claim that the physical activity is explicitly represented and verified as enacting the intended operation

  - gate_id: KEVA-PA-05
    name: independent_transfer
    status: empirical_pending
    findings:
      - JHB-KEVA-002
    failure_effect: block empirical claim that the repeatable plan demonstrates the intended keva mechanism

acceptance_status:
  accepted_baseline: false
  accepted_product: false
  current_result: blocked_pending_identity_discernment_and_product_validation
  structural_ci_equivalence: explicitly_false

next_acceptance_move: >
  Resolve exact candidate identity and the discernment criterion first, then classify
  operation mode and evaluate the exact candidate or later product against the remaining
  activity, transfer, and artifact-level gates.
